name: Pinned gRPC CP312 native Windows ARM64
on:
  push:
    branches: [ci/cp312-win-arm64-pinned]
permissions:
  contents: read
  actions: read
jobs:
  build-test:
    runs-on: windows-11-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.83.0'
            source: c876f4da50f7da2f331888b88b2a7243514139fe
            url: https://files.pythonhosted.org/packages/0c/98/304898ac4e04e2d5e4e4c2eadc178b1f2a16d5f4bc2f91306c87d64680b9/grpcio-1.83.0.tar.gz
            sha256: 7674587248fbbb2ac6e4eecf83a8a0f3d91a928f941de571acfd3a2f007fbc24
          - version: '1.72.2'
            source: d6b42b2fd3e522a60318c7e2f2021219c6b5c470
            url: https://files.pythonhosted.org/packages/f0/8d/e1ec7526a9b4a77dd9da80969c51fc4d49b32391e497a73fb05d2327b2f8/grpcio-1.72.2.tar.gz
            sha256: ee5b77cfd1c098df244cc237f84bf8f9b32740e75a52d761860f19c14df22c1d
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: grpc/grpc
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - name: Isolated artifact and cache root
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/evidence"
          New-Item -ItemType Directory -Force $stage | Out-Null
          "STAGE=$stage" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP/pip-cache" >> $env:GITHUB_ENV
          "VIRTUALENV_OVERRIDE_APP_DATA=$env:RUNNER_TEMP/virtualenv" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Check native interpreter and pinned build environment
        env:
          VERSION: ${{ matrix.version }}
        run: |
          python -c "import sys,sysconfig; print(sys.version, sysconfig.get_platform()); assert sysconfig.get_platform() == 'win-arm64'; assert sys.version_info[:2] == (3,12)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install pip==25.2 setuptools==80.9.0 wheel==0.45.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:VERSION -eq '1.72.2') { python -m pip install Cython==3.1.1; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Native tiny compiler RED GREEN
        run: |
          python harness/native-ci/probe_msvc_parallel.py --native > "$env:STAGE/msvc-red.txt" 2>&1
          if ($LASTEXITCODE -ne 1) { throw 'Expected serial dispatch assertion' }
          python harness/native-ci/probe_msvc_parallel.py --patched --native > "$env:STAGE/msvc-green.txt" 2>&1
          exit $LASTEXITCODE
      - name: Build hash-pinned release source
        env:
          VERSION: ${{ matrix.version }}
          SDIST_URL: ${{ matrix.url }}
          SDIST_SHA256: ${{ matrix.sha256 }}
          SOURCE_SHA: ${{ matrix.source }}
        run: |
          python harness/native-ci/build_grpc_release.py grpcio $env:VERSION $env:SDIST_URL $env:SDIST_SHA256 $env:SOURCE_SHA
          exit $LASTEXITCODE
      - name: Reuse already audited grpcio-tools wheel without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: grpcio-tools-1.72.2-cp312-win-arm64
          run-id: 38181409288
          github-token: ${{ github.token }}
          path: reused-tools
      - name: Audit wheel native PE and RECORD
        run: |
          $tools = Get-Item reused-tools/grpcio_tools-1.72.2-cp312-cp312-win_arm64.whl
          if ((Get-FileHash $tools.FullName -Algorithm SHA256).Hash.ToLower() -ne '751947d6fcba2f131f08fdc82261cc99c90b4b4617a41132f08c88c3835bf223') { throw 'Tools hash mismatch' }
          Copy-Item $tools.FullName $env:STAGE
          python harness/native-ci/wheel_audit.py "$env:STAGE"
          exit $LASTEXITCODE
      - name: Fresh venv generated-stub and loopback RPC tests
        env:
          EXPECTED_GRPC_VERSION: ${{ matrix.version }}
        run: |
          python -m venv "$env:RUNNER_TEMP/fresh-runtime"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $py = "$env:RUNNER_TEMP/fresh-runtime/Scripts/python.exe"
          $wheels = (Get-ChildItem $env:STAGE -Filter '*.whl').FullName
          & $py -m pip install $wheels protobuf==6.33.5 setuptools==80.9.0 pytest==8.4.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pip freeze > "$env:STAGE/installed.txt"
          & $py -m pytest harness/native-ci/test_grpc_native.py -v --junitxml="$env:STAGE/native.xml"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-grpcio-${{ matrix.version }}
          path: ${{ env.STAGE }}
          if-no-files-found: error
